<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Scents by Ahmed</title><link rel="stylesheet" href="styles.css"><style>
body{background:#0b0b0b;color:#f7f4ee}.admin{max-width:1250px;margin:auto;padding:34px 22px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.admin-head img{width:190px;filter:brightness(1.1)}.gold{color:#c9a45b}.btn{border:1px solid #c9a45b;background:#c9a45b;color:#111;padding:11px 16px;border-radius:3px;font-weight:700;cursor:pointer}.btn.ghost{background:transparent;color:#c9a45b}.login{max-width:430px;margin:12vh auto;padding:35px;border:1px solid #2b2b2b;background:#121212}.login h1{font-family:Georgia,serif;font-size:32px;margin:0 0 8px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#aaa}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;background:#0b0b0b;border:1px solid #333;color:#fff;padding:12px;border-radius:2px}.field textarea{min-height:85px;resize:vertical}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:25px}.stat{background:#121212;border:1px solid #272727;padding:18px}.stat b{font-size:25px;display:block;margin-top:6px}.tabs{display:flex;gap:8px;border-bottom:1px solid #2b2b2b;margin-bottom:20px}.tab{padding:12px 18px;background:none;border:0;color:#aaa;cursor:pointer}.tab.active{color:#c9a45b;border-bottom:2px solid #c9a45b}.panel{display:none}.panel.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}.tablewrap{overflow:auto;border:1px solid #292929}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px;border-bottom:1px solid #292929;text-align:left;font-size:13px}.table th{color:#c9a45b;text-transform:uppercase;font-size:11px;letter-spacing:.12em}.thumb{width:46px;height:58px;object-fit:cover;background:#1b1b1b}.pill{display:inline-block;padding:5px 8px;border:1px solid #444;text-transform:capitalize;font-size:11px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modal-card{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #333;padding:25px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.message{padding:14px;border:1px solid #292929;margin-bottom:10px}.muted{color:#999}.danger{color:#e7a0a0;border-color:#744}.order-items{font-size:12px;color:#bbb;line-height:1.6}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="login" class="login"><img src="assets/logo.png" alt="Scents by Ahmed" style="width:210px;margin-bottom:25px"><h1>Admin <span class="gold">Studio</span></h1><p class="muted">Manage products, orders and customer messages.</p><form id="loginForm"><div class="field"><label>Admin password</label><input id="password" type="password" required></div><button class="btn" type="submit">Sign in</button><p id="loginError" class="muted"></p></form></div>
<main id="app" class="admin" hidden><header class="admin-head"><div><img src="assets/logo.png" alt="Scents by Ahmed"><p class="muted">Store management dashboard</p></div><button class="btn ghost" id="logout">Log out</button></header>
<section class="stats"><div class="stat">Active products<b id="sProducts">0</b></div><div class="stat">Orders<b id="sOrders">0</b></div><div class="stat">Pending<b id="sPending">0</b></div><div class="stat">Messages<b id="sMessages">0</b></div><div class="stat">Revenue<b id="sRevenue">PKR 0</b></div></section>
<nav class="tabs"><button class="tab active" data-tab="products">Products</button><button class="tab" data-tab="orders">Orders</button><button class="tab" data-tab="messages">Messages</button></nav>
<section id="products" class="panel active"><div class="toolbar"><h2>Products</h2><button class="btn" id="addProduct">+ Add product</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Photo</th><th>Product</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody id="productRows"></tbody></table></div></section>
<section id="orders" class="panel"><div class="toolbar"><h2>Orders</h2><button class="btn ghost" onclick="loadAll()">Refresh</button></div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="orderRows"></tbody></table></div></section>
<section id="messages" class="panel"><div class="toolbar"><h2>Messages</h2></div><div id="messageList"></div></section></main>
<div id="modal" class="modal"><div class="modal-card"><h2 id="modalTitle">Add Product</h2><form id="productForm"><input id="pid" type="hidden"><div class="grid2"><div class="field"><label>Name</label><input id="pname" required></div><div class="field"><label>Price (PKR)</label><input id="pprice" type="number" min="0" required></div></div><div class="field"><label>Notes</label><input id="pnotes" placeholder="Oud · Amber · Vanilla"></div><div class="field"><label>Description</label><textarea id="pdesc"></textarea></div><div class="field"><label>Product image</label><input id="pimage" placeholder="/assets/products/my-perfume.jpg"><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></div><div class="field"><label>Status</label><select id="pactive"><option value="1">Active — show on website</option><option value="0">Hidden — keep in database</option></select></div><div class="modal-actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn">Save product</button></div></form></div></div>
<script>
const $=s=>document.querySelector(s), token=()=>localStorage.getItem('sba_admin_token'); const money=n=>'PKR '+Number(n).toLocaleString('en-PK');
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(url,opt);if(r.status===401){logout();throw Error('Unauthorized')}const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function logout(){localStorage.removeItem('sba_admin_token');$('#app').hidden=true;$('#login').style.display='block'}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});const d=await r.json();if(r.ok){localStorage.setItem('sba_admin_token',d.token);showApp()}else $('#loginError').textContent=d.error||'Login failed'};
$('#logout').onclick=logout;
function showApp(){$('#login').style.display='none';$('#app').hidden=false;loadAll()}
async function loadAll(){try{const [s,ps,os,ms]=await Promise.all([api('/api/admin/dashboard'),api('/api/admin/products'),api('/api/admin/orders'),api('/api/admin/messages')]);$('#sProducts').textContent=s.products;$('#sOrders').textContent=s.orders;$('#sPending').textContent=s.pending;$('#sMessages').textContent=s.messages;$('#sRevenue').textContent=money(s.revenue);renderProducts(ps);renderOrders(os);renderMessages(ms)}catch(e){console.error(e)}}
function renderProducts(ps){$('#productRows').innerHTML=ps.map(p=>`<tr><td>${p.image?`<img class="thumb" src="${p.image}">`:'—'}</td><td><b>${esc(p.name)}</b><div class="muted">${esc(p.notes||'')}</div></td><td>${money(p.price_pkr)}</td><td><span class="pill">${p.active?'active':'hidden'}</span></td><td><button class="btn ghost" onclick='editProduct(${JSON.stringify(p)})'>Edit</button> <button class="btn ghost danger" onclick='deleteProduct(${p.id})'>Hide</button></td></tr>`).join('')}
function renderOrders(os){$('#orderRows').innerHTML=os.map(o=>`<tr><td>#${o.id}</td><td><b>${esc(o.customer_name)}</b><div class="muted">${esc(o.phone)}<br>${esc(o.address)}, ${esc(o.city||'')}</div></td><td class="order-items">${o.items.map(i=>`${esc(i.product_name)} × ${i.quantity}`).join('<br>')}</td><td>${money(o.total_pkr)}</td><td><select onchange="setStatus(${o.id},this.value)"><option ${o.status==='pending'?'selected':''}>pending</option><option ${o.status==='confirmed'?'selected':''}>confirmed</option><option ${o.status==='shipped'?'selected':''}>shipped</option><option ${o.status==='delivered'?'selected':''}>delivered</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></td><td>${new Date(o.created_at.replace(' ','T')+'Z').toLocaleString()}</td></tr>`).join('')}
function renderMessages(ms){$('#messageList').innerHTML=ms.length?ms.map(m=>`<article class="message"><b>${esc(m.name)}</b> <span class="muted">${esc(m.email)}</span><div style="margin:9px 0">${esc(m.message)}</div><small class="muted">${new Date(m.created_at.replace(' ','T')+'Z').toLocaleString()}</small></article>`).join(''):'<p class="muted">No messages yet.</p>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function editProduct(p){$('#modalTitle').textContent='Edit Product';$('#pid').value=p.id;$('#pname').value=p.name;$('#pprice').value=p.price_pkr;$('#pnotes').value=p.notes||'';$('#pdesc').value=p.description||'';$('#pimage').value=p.image||'';$('#pactive').value=p.active?1:0;$('#modal').classList.add('open')}
$('#addProduct').onclick=()=>{editProduct({id:'',name:'',price_pkr:2999,notes:'',description:'',image:'',active:1});$('#modalTitle').textContent='Add Product';$('#pid').value=''};
$('#cancel').onclick=()=>$('#modal').classList.remove('open');
$('#productForm').onsubmit=async e=>{e.preventDefault();try{let image=$('#pimage').value.trim();const f=$('#imageFile').files[0];if(f){const fd=new FormData();fd.append('image',f);const up=await api('/api/admin/upload',{method:'POST',body:fd});image=up.url}const body={name:$('#pname').value.trim(),price_pkr:Number($('#pprice').value),notes:$('#pnotes').value,description:$('#pdesc').value,image,active:Number($('#pactive').value)};const id=$('#pid').value;await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('#modal').classList.remove('open');loadAll()}catch(e){alert(e.message)}};
async function deleteProduct(id){if(!confirm('Hide this product from the website?'))return;await api('/api/admin/products/'+id,{method:'DELETE'});loadAll()}
async function setStatus(id,status){await api('/api/admin/orders/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadAll()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});
if(token())showApp();
</script></body></html>
